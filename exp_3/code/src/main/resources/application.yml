server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${PORT:8080}
  servlet:
    session:
      timeout: 60m
      cookie:
        http-only: true
        same-site: lax
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:55432/hotel}
    username: ${DB_USER:hotel}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 24
      connection-timeout: 10000
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  jackson:
    time-zone: Asia/Shanghai
hotel:
  demo: ${HOTEL_DEMO:false}
  uploads: ${UPLOAD_DIR:uploads}
  jobs-enabled: ${JOBS_ENABLED:true}
  scan-delay: 5000
logging:
  level:
    root: INFO
    org.springframework.security: WARN
